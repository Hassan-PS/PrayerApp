Builds:
  # 2.8.5 was withdrawn — its tag was deleted before F-Droid's bot had seen
  # it, and a build entry pointing at a missing ref fails the F-Droid build.
  # Since the MR merged (1 Aug 2026) the bot adds each version from the tag
  # on its own; this file is the mirror we keep in the app repo, not the
  # thing F-Droid reads.
  - versionName: 2.17.0
    versionCode: 262
    commit: v2.17.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - fdroid
    prebuild:
      - sed -i 's/SdkVersion = 37/SdkVersion = 36/' ../build.gradle
      - sed -i 's/"37.0.0"/"36.0.0"/' ../build.gradle
      - cd ../..
      - npm ci --omit=optional --omit=dev --ignore-scripts --loglevel=error
      - npm i --no-save --ignore-scripts --loglevel=error patch-package
      - node node_modules/.bin/patch-package
      - find node_modules/@react-native/gradle-plugin -name build.gradle.kts -exec
        sed -i '/jvmToolchain/d' {} \;
    scanignore:
      - node_modules/@notifee/react-native/android/build.gradle
      - node_modules/@notifee/react-native/android/libs
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/@react-native-community/blur/android/build.gradle
      - node_modules/@react-native-community/geolocation/android/build.gradle
      - node_modules/@react-native-community/netinfo/android/build.gradle
      - node_modules/react-native-blob-util/android/build.gradle
      - node_modules/react-native-color-matrix-image-filters/android/build.gradle
      - node_modules/react-native-encrypted-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-share/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-track-player/android/build.gradle
      - node_modules/react-native-view-shot/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
    scandelete:
      - node_modules
    ndk: 27.1.12297006
    gradleprops:
      - reactNativeArchitectures=arm64-v8a

AutoUpdateMode: Version
UpdateCheckMode: Tags
