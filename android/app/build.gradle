apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    /* Match native-stack + F-Droid debug variant names */
    debuggableVariants = ["playDebug", "fdroidDebug"]
}

// R8/Proguard is ON for the Play release (smaller APK / store expectation) but
// OFF for the F-Droid build: F-Droid CI runs R8 in parallel with lintVital on
// every native module and OOM-kills the runner. `enableProguardInReleaseBuilds`
// is computed from the requested tasks just below (see `wantsFdroid`) so the two
// distribution flavors differ without any recipe-side prebuild injection.

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Release signing: copy android/keystore.properties.example → android/keystore.properties (gitignored).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def requiredReleaseKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def hasReleaseSigningConfig = keystorePropertiesFile.exists() &&
    requiredReleaseKeys.every { key -> (keystoreProperties[key] ?: "").toString().trim() }
def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
// Only enable ABI splits / strict signing for explicit play-flavor release/beta tasks.
// The check must exclude fdroid tasks (e.g. "assemblefdroidrelease") even though the
// string "playrelease" does NOT appear there — but running both tasks in one invocation
// (e.g. `assembleFdroidRelease bundlePlayRelease`) would previously match via the
// lowercased "bundleplayrelease" containing "playrelease". Being explicit prevents that.
def wantsPlayRelease = requestedTasks.any { t ->
    (t == "assembleplayrelease" || t == "bundleplayrelease" ||
     t == "assembleplaybeta"   || t == "bundleplaybeta") &&
    !t.contains("fdroid")
}
// True when this invocation builds the F-Droid flavor. Used to trim R8 + release
// lint for the F-Droid build only (keeps the Play build fully minified + linted).
def wantsFdroid = requestedTasks.any { it.contains("fdroid") }
def wantsPlayAny = requestedTasks.any { t -> t.contains("play") && !t.contains("fdroid") }
/**
 * ONE INVOCATION CANNOT SERVE BOTH FLAVOURS, AND SILENTLY PICKING ONE SHIPPED
 * AN UNOPTIMIZED APP TO PLAY.
 *
 * `minifyEnabled` is a property of the release BUILD TYPE, so it is decided
 * once per Gradle invocation — it cannot differ between `playRelease` and
 * `fdroidRelease` in the same run. The flag below turned R8 off whenever any
 * requested task mentioned fdroid, and `android:releaseAll` requested
 * `assemblePlayRelease assembleFdroidRelease bundlePlayRelease` together. So
 * the one command that builds everything for a release produced a Play bundle
 * with no R8 at all, quietly, and Play Console noticed before we did:
 * "improve your app's memory and performance with R8 optimisation" against
 * 2.8.10.
 *
 * F-Droid's builder runs `assembleFdroidRelease` alone and still gets minify
 * off, which is what it needs (their CI runs out of memory otherwise). A run
 * that asks for both now stops rather than guessing: `android:releaseAll`
 * issues two separate Gradle invocations instead.
 */
if (wantsFdroid && wantsPlayAny) {
    throw new GradleException(
        "Refusing to build the play and fdroid flavors in one Gradle invocation: " +
        "minifyEnabled is per build type, so one of the two would silently get the " +
        "other's R8 setting — which is how an unminified bundle reached Play. " +
        "Run them separately, e.g. `./gradlew assemblePlayRelease bundlePlayRelease` " +
        "then `./gradlew assembleFdroidRelease`."
    )
}
def enableProguardInReleaseBuilds = !wantsFdroid
if (wantsPlayRelease && !hasReleaseSigningConfig) {
    throw new GradleException(
        "Play release/beta builds require android/keystore.properties with storeFile/storePassword/keyAlias/keyPassword. " +
        "Refusing to fallback to debug signing for playRelease / playBeta."
    )
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.prayer_times"

    /*
     * The Qur'an translations ship as ASSETS, not inside the JS bundle.
     *
     * They are ~16 MB across thirteen editions, and `index.android.bundle`
     * is STORED in the APK — Android does not compress a `.bundle`, so
     * every one of those megabytes was paid at full price on every
     * download. As ordinary assets they compress like the JSON they are,
     * to roughly a quarter of that.
     *
     * Held at the repo root rather than under `android/` because the same
     * files are read by the iOS build, which copies this directory into
     * its own bundle. One copy, two platforms, and the loader in
     * `src/quran/translations.ts` asks each platform for its own path.
     */
    sourceSets {
        main {
            assets.srcDirs += ["$rootDir/../assets"]
        }
    }

    defaultConfig {
        applicationId "com.prayer_times"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 262
        versionName "2.17.0"
    }
    flavorDimensions += "distribution"
    productFlavors {
        /**
         * The split is no longer about billing — the tip jar and its
         * `react-native-iap` dependency are gone. What is left is the reason
         * the F-Droid build exists at all: no Google Play Services, which
         * `patch-package` strips from the location library, and no Play Store
         * for `rateApp` to open.
         */
        play {
            dimension "distribution"
        }
        fdroid {
            dimension "distribution"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigningConfig) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Installs beside the stable app instead of replacing it. A debug
            // build is signed with a different key, so without this, putting
            // one on a real phone means uninstalling the release first and
            // taking the user's bookmarks, khatmah and journal with it.
            applicationIdSuffix ".debug"
            buildConfigField "boolean", "IS_BETA", "false"
        }
        release {
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            // Resource shrinking (Play Console "Teknisk kvalitet"
            // recommendation, 2026-07-16). Guarded by the same flag so
            // the F-Droid flavor (minify off — CI OOM) stays untouched;
            // shrinkResources requires minifyEnabled.
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            buildConfigField "boolean", "IS_BETA", "false"
        }
        // Beta build type — separate test channel (added 2026-05-04).
        //
        // Inherits the release config (R8/Proguard, signing) but installs
        // alongside the stable app via the `.beta` applicationId suffix.
        // The `beta` source set (android/app/src/beta/) overrides
        // `app_name` to "Prayer times test" so the launcher icon is
        // unambiguous. Build with: ./gradlew assembleFdroidBeta or
        // ./gradlew bundlePlayBeta.
        beta {
            initWith release
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
            matchingFallbacks = ['release']
            buildConfigField "boolean", "IS_BETA", "true"
            // The React Native gradle plugin defines usesCleartextTraffic
            // for the stock debug/release types only. `initWith release`
            // doesn't propagate manifestPlaceholders, so we set it here
            // (matching release: cleartext disabled).
            manifestPlaceholders.usesCleartextTraffic = "false"
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    lint {
        // The F-Droid build runs lintVitalAnalyze on every native module in
        // parallel with R8 and OOM-kills the CI runner, so skip release lint for
        // the F-Droid flavor only. The Play release keeps full lint coverage.
        checkReleaseBuilds !wantsFdroid
    }

    // Per-ABI APK splits: only for the `play` flavor so F-Droid still produces
    // a single universal APK (required by their build recipe). Splits must
    // also be OFF for bundle* tasks — the AAB already delivers per-ABI, and
    // shrinkResources + splits + bundling trips AGP's "Multiple
    // shrunk-resources files found" bug (issuetracker.google.com/402800800).
    def isBundling = gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }
    splits {
        abi {
            enable wantsPlayRelease && !isBundling
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    /**
     * Stays at 1.12.0. 1.13.0 was tried for the Android 15 edge-to-edge
     * deprecations Play Console flags and does not fix them: its
     * `EdgeToEdgeUtils.applyEdgeToEdge` still calls `setStatusBarColor` and
     * `setNavigationBarColor` unconditionally — checked in the 1.13.0 AAR's
     * own bytecode, not assumed from the release notes. Two of the three
     * Material call sites Play named (`BottomSheetDialog`, `SheetDialog`)
     * are gone anyway now that R8 runs again: nothing in the app uses them,
     * so R8 strips them.
     */
    implementation("com.google.android.material:material:1.12.0")

    /**
     * Scanning a pairing code off another phone's screen.
     *
     * CameraX for the plumbing and ZXing for the decoding, and neither is a
     * casual choice for an app that ships on F-Droid. ML Kit would be one
     * line and would drag in Google Play Services, which the F-Droid build
     * exists to be free of. `zxing:core` is pure Java under Apache 2.0 with
     * no services of any kind, and androidx.camera is the platform's own
     * camera stack. Both build from source on Maven Central like every
     * other gradle dependency here.
     *
     * `zxing:core` only, not `zxing-android-embedded`: the latter brings an
     * activity, a view, and its own UI to argue with.
     */
    implementation("androidx.camera:camera-camera2:1.4.1")
    implementation("androidx.camera:camera-lifecycle:1.4.1")
    implementation("androidx.camera:camera-view:1.4.1")
    implementation("com.google.zxing:core:3.5.3")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
